name: Collect social metrics

on:
  schedule:
    # 06:12 UTC, aimed at breakfast in Tel Aviv: 09:12 in summer (IDT, UTC+3)
    # and 08:12 in winter (IST, UTC+2). GitHub's cron is UTC-only and ignores
    # Israeli daylight saving, so the hour shifts once a year — accepted, the
    # exact hour does not matter.
    #
    # The odd minute is deliberate. GitHub queues scheduled workflows and
    # delays them under load; jobs asking for the top of the hour wait the
    # longest. At "0 6 * * *" this workflow was actually starting 5-10 hours
    # late. An off-peak minute is the standard mitigation — but GitHub still
    # guarantees nothing, so treat the time as "each morning", not a promise.
    #
    # Daily (not weekly) keeps recent posts' like/comment counts within ~24h
    # of Instagram: they keep gaining engagement after publish, so a weekly
    # snapshot lagged noticeably.
    - cron: "12 6 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # collector.py uses only the Python standard library — nothing to install
      - name: Run collector
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: python3 collector.py

      # Rule-based plain-English summary of the week, written to Airtable and
      # shown on the dashboard. Runs after the collector so it reads the
      # metrics this run just wrote.
      - name: Generate weekly takeaway
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: python3 takeaway.py

      # Guard rails for the invariants that break silently — see selfcheck.py.
      # Runs last so a problem here never costs us the day's data.
      - name: Self-check
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python3 selfcheck.py

      - name: Explain failure (for non-technical maintainers)
        if: failure()
        run: |
          echo "::error::This run failed. Scroll up to the first red step and read its message — it says what to do in plain English. The usual causes, in order: (1) the Meta permission needs renewing — follow 'Renewing the Meta token' in the README, then put the new token in the META_ACCESS_TOKEN secret (needs Admin on this repo) and re-run; (2) a self-check found a problem, in which case the day's data was still collected and the message names exactly what to fix; (3) Meta or Airtable were temporarily unavailable — if so, simply re-running this workflow will succeed."
