<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mamram Alumni — Social Media Summary</title>
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface:        #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --good:           #006300;
    --bad:            #d03b3b;
    --fb:             #2a78d6;
    --ig:             #1baf7a;
    --metric-a:       #2a78d6;
    --metric-b:       #4a3aa7;
    /* status colours — reserved, never reused for series */
    --st-green:       #0ca30c;
    --st-yellow:      #fab219;
    --st-red:         #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface:        #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --axis:           #383835;
      --border:         rgba(255,255,255,0.10);
      --good:           #0ca30c;
      --bad:            #e66767;
      --fb:             #3987e5;
      --ig:             #199e70;
      --metric-a:       #3987e5;
      --metric-b:       #9085e9;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px clamp(16px, 5vw, 48px) 48px;
    text-align: center;
  }
  main { width: 100%; max-width: 680px; }

  header h1 { font-size: 17px; font-weight: 600; color: var(--text-secondary); }
  header p  { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

  /* range selector */
  .ranges { display: flex; gap: 8px; justify-content: center; margin: 22px 0 26px; flex-wrap: wrap; }
  .range-btn {
    font: inherit; font-size: 13.5px; color: var(--text-secondary);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 18px; cursor: pointer;
  }
  .range-btn:hover { color: var(--text-primary); }
  .range-btn[aria-pressed="true"] {
    color: var(--text-primary); font-weight: 600; border-color: var(--axis);
  }

  /* the verdict — the one guaranteed-visible element */
  .verdict { transition: opacity .15s; }
  .verdict.loading { opacity: .45; }
  .badge {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: clamp(30px, 7vw, 46px); font-weight: 650; letter-spacing: -.02em;
  }
  .badge .dot { font-size: .85em; line-height: 1; }
  .badge.green  { color: var(--st-green); }
  .badge.yellow { color: var(--st-yellow); }
  .badge.red    { color: var(--st-red); }
  .badge.unknown { color: var(--text-muted); }

  .sentence {
    font-size: clamp(16px, 2.4vw, 19px); line-height: 1.5;
    color: var(--text-primary); margin: 18px auto 0; max-width: 30em;
  }
  .asof { color: var(--text-muted); font-size: 12.5px; margin-top: 14px; }

  /* supporting metric chips — small, secondary to the badge */
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  .chip {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 13px; font-size: 13px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip .key { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .chip .lbl { color: var(--text-secondary); }
  .chip.muted { color: var(--text-muted); }
  .chip b { font-variant-numeric: tabular-nums; }
  .up   { color: var(--good); font-weight: 650; }
  .down { color: var(--bad);  font-weight: 650; }
  .flat { color: var(--text-muted); font-weight: 650; }

  .details-link {
    display: inline-block; margin-top: 30px; font-size: 14.5px;
    color: var(--metric-a); text-decoration: none;
  }
  .details-link:hover { text-decoration: underline; }

  #status { color: var(--text-muted); padding: 40px 0; }
  #status.error { color: var(--bad); max-width: 34em; margin: 0 auto; }
</style>
</head>
<body>

<main>
  <header>
    <h1>Mamram Alumni Association — Social Media</h1>
    <p>Facebook &amp; Instagram · updated daily</p>
  </header>

  <div id="status">Loading…</div>

  <div id="app" hidden>
    <div class="ranges" id="ranges">
      <button class="range-btn" data-range="week" aria-pressed="true">Week</button>
      <button class="range-btn" data-range="month">Month</button>
      <button class="range-btn" data-range="quarter">Quarter</button>
    </div>

    <div class="verdict" id="verdict">
      <div class="badge" id="badge"></div>
      <p class="sentence" id="sentence"></p>
      <div class="chips" id="chips"></div>
      <p class="asof" id="asof"></p>
    </div>

    <a class="details-link" href="details.html">View details →</a>
  </div>
</main>

<script src="config.js"></script>
<script src="shared.js"></script>
<script>
"use strict";
const CFG = window.DASHBOARD_CONFIG || {};
let DATA = null;

function renderVerdict(rangeKey) {
  const v = computeVerdict(DATA, rangeKey);

  const badge = document.getElementById("badge");
  badge.className = "badge " + v.badge;
  badge.textContent = "";
  const dot = document.createElement("span");
  dot.className = "dot";
  dot.textContent = v.emoji;
  const label = document.createElement("span");
  label.textContent = v.text;
  badge.append(dot, label);

  document.getElementById("sentence").textContent = v.sentence;

  /* Supporting numbers, one chip per metric that had data. Kept visually
   * quiet — the badge is the answer, these are the evidence. */
  const chips = document.getElementById("chips");
  chips.textContent = "";
  for (const m of v.metrics) {
    const c = document.createElement("span");
    c.className = "chip";
    const key = document.createElement("i");
    key.className = "key";
    key.style.background = COLOR[m.platform] || "var(--text-muted)";
    const lbl = document.createElement("span");
    lbl.className = "lbl";
    lbl.textContent = `${m.platform} ${m.label}`;
    const val = document.createElement("b");
    val.className = m.score > 0 ? "up" : m.score < 0 ? "down" : "flat";
    if (m.display) {
      // follower growth shows counts, not a percentage
      val.textContent = (m.score > 0 ? "▲ " : m.score < 0 ? "▼ " : "") + m.display;
    } else {
      const pct = Math.min(Math.abs(m.delta), MAX_DISPLAY_PCT);
      const over = Math.abs(m.delta) > MAX_DISPLAY_PCT ? ">" : "";
      val.textContent = (m.delta >= 0 ? "▲ +" : "▼ ") + over + pct.toFixed(0) + "%";
    }
    c.append(key, lbl, val);
    chips.appendChild(c);
  }

  /* Name any platform the verdict could not measure, so "On track" is never
   * mistaken for a statement about both channels. */
  if (v.silent && v.silent.length) {
    const note = document.createElement("span");
    note.className = "chip muted";
    note.textContent = `${v.silent.join(" & ")}: no measurable change`;
    chips.appendChild(note);
  }

  const latest = DATA.snapshots.length ? DATA.snapshots[DATA.snapshots.length - 1].Date : null;
  document.getElementById("asof").textContent =
    `${fmtDate(v.from)} – ${fmtDate(v.to)} vs the previous ${RANGES[rangeKey].label.toLowerCase()}`
    + (latest ? ` · data through ${fmtDate(latest)}` : "");
}

document.getElementById("ranges").addEventListener("click", ev => {
  const btn = ev.target.closest(".range-btn");
  if (!btn) return;
  for (const b of document.querySelectorAll(".range-btn")) b.setAttribute("aria-pressed", "false");
  btn.setAttribute("aria-pressed", "true");
  renderVerdict(btn.dataset.range);
});

(async () => {
  const status = document.getElementById("status");
  if (!CFG.AIRTABLE_TOKEN || CFG.AIRTABLE_TOKEN.includes("XXXX")) {
    status.className = "error";
    status.textContent = "Not configured: copy config.example.js to config.js and fill in the Airtable read-only token and base ID.";
    return;
  }
  try {
    DATA = await loadAll();
    status.hidden = true;
    document.getElementById("app").hidden = false;
    renderVerdict("week");
  } catch (e) {
    status.className = "error";
    status.textContent = "Could not load data from Airtable: " + e.message +
      " — check the token and base ID in config.js.";
  }
})();
</script>
</body>
</html>
